name: Sincronizar estoque e devolucoes (Tiny -> nuvem)

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch: {}

concurrency:
  group: sync-estoque
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-sync.txt
      - name: Instalar bibliotecas
        run: pip install -r requirements-sync.txt
      - name: Sincronizar estoque
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TOKEN_TINY: ${{ secrets.TOKEN_TINY }}
        run: python sincronizacao/sincronizar_estoque_cloud.py
      - name: Sincronizar devolucoes
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TOKEN_TINY: ${{ secrets.TOKEN_TINY }}
        run: python sincronizacao/sincronizar_devolucoes_cloud.py
